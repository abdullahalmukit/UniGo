<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" fill="none">
  <defs>
    <filter id="pin-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#e11d48" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="pin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="35%" stop-color="#f43f5e"/>
      <stop offset="80%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="pedestal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="36" cy="40" r="26" fill="#f43f5e" opacity="0.22" filter="blur(8px)"/>

  <!-- Radar Ripples & Ground Platform -->
  <ellipse cx="36" cy="58" rx="24" ry="9" stroke="#fda4af" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <ellipse cx="36" cy="58" rx="16" ry="6" fill="url(#pedestal-grad)" stroke="#f43f5e" stroke-width="1.5"/>
  <ellipse cx="36" cy="58" rx="7" ry="2.8" fill="#e11d48" opacity="0.8"/>

  <!-- 3D Volumetric Map Pin -->
  <g filter="url(#pin-shadow)">
    <!-- Main Teardrop Body -->
    <path d="M36 10C24.4 10 15 19.4 15 31C15 44.5 32 58 36 60.5C40 58 57 44.5 57 31C57 19.4 47.6 10 36 10Z" fill="url(#pin-grad)"/>

    <!-- Top Glossy Reflection Bubble -->
    <path d="M36 12C26.5 12 18.5 19.5 17.5 29C20 23 27 16 38 13.5C37.3 12.5 36.6 12 36 12Z" fill="#ffffff" opacity="0.45"/>

    <!-- Inner Core Cutout -->
    <circle cx="36" cy="29" r="8.5" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.25))"/>
    <circle cx="36" cy="29" r="5.5" fill="#be123c"/>
    <circle cx="34.5" cy="27.5" r="1.8" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Sparkling Highlights -->
  <path d="M49 14L50.5 17.5L54 19L50.5 20.5L49 24L47.5 20.5L44 19L47.5 17.5Z" fill="#ffffff" opacity="0.9"/>
  <circle cx="20" cy="40" r="1.5" fill="#fda4af"/>
</svg>