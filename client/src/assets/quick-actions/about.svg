<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" fill="none">
  <defs>
    <filter id="about-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#004e7a" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003858"/>
      <stop offset="45%" stop-color="#005b8e"/>
      <stop offset="100%" stop-color="#0070a8"/>
    </linearGradient>
    <linearGradient id="shield-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#004e7a" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cap-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="36" cy="38" r="26" fill="#0070a8" opacity="0.25" filter="blur(8px)"/>

  <!-- 3D Crest Shield Base -->
  <g filter="url(#about-shadow)">
    <path d="M36 6C20 6 12 12 12 24C12 44 26 58 36 65C46 58 60 44 60 24C60 12 52 6 36 6Z" fill="url(#shield-grad)"/>
    <path d="M36 7.5C21 7.5 13.5 13 13.5 24C13.5 43 26.5 56.5 36 63.2C45.5 56.5 58.5 43 58.5 24C58.5 13 51 7.5 36 7.5Z" stroke="url(#shield-rim)" stroke-width="2"/>
    <!-- Glass Sheen Overlay -->
    <path d="M36 8C22 8 15 13.5 14 24C13.5 29 15 36 18 42C23 32 30 18 48 10C44 8.7 39.8 8 36 8Z" fill="#ffffff" opacity="0.18"/>
  </g>

  <!-- 3D Mortarboard Graduation Cap -->
  <g>
    <!-- Cap Skull Base -->
    <path d="M25 36C25 41 30 45 36 45C42 45 47 41 47 36L47 33L25 33Z" fill="#0f172a"/>
    <path d="M26 36C26 40 30.5 43.5 36 43.5C41.5 43.5 46 40 46 36" stroke="#475569" stroke-width="1.2"/>

    <!-- 3D Rhomboid Top in Perspective -->
    <polygon points="36,18 56,26 36,34 16,26" fill="url(#cap-top)" stroke="#64748b" stroke-width="1.2"/>
    <polygon points="36,20 54,26.5 36,32.5 18,26.5" fill="#ffffff" opacity="0.12"/>

    <!-- Golden Button & Tassel -->
    <circle cx="36" cy="26" r="2.8" fill="url(#gold-grad)"/>
    <path d="M36 26 Q 44 28 47 34 Q 48 39 49 44" fill="none" stroke="url(#gold-grad)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Tassel Fringe -->
    <path d="M47 43L51 43L50 49L48 49Z" fill="url(#gold-grad)"/>
  </g>

  <!-- Sparkling Golden Star -->
  <path d="M36 47L37.8 52L43 52.8L39 56.4L40.2 61.5L36 58.8L31.8 61.5L33 56.4L29 52.8L34.2 52Z" fill="url(#gold-grad)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"/>
  <circle cx="21" cy="18" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="53" cy="16" r="1.2" fill="#ffffff" opacity="0.8"/>
</svg>