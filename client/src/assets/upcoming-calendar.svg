<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 84" width="84" height="84" fill="none">
  <defs>
    <!-- Master 3D Shadow -->
    <filter id="up-master-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#004e7a" flood-opacity="0.5"/>
    </filter>

    <!-- Deep Sapphire Base Gradients -->
    <linearGradient id="up-pad-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003858"/>
      <stop offset="45%" stop-color="#005b8e"/>
      <stop offset="100%" stop-color="#0070a8"/>
    </linearGradient>

    <linearGradient id="up-pad-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#004e7a" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Calendar Top Binding Bar -->
    <linearGradient id="up-bar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#004e7a"/>
      <stop offset="100%" stop-color="#002b44"/>
    </linearGradient>

    <!-- Metallic Chrome Ring Binders -->
    <linearGradient id="up-chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Crisp 3D Calendar Sheet -->
    <linearGradient id="up-sheet-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Floating 3D Clock Dial -->
    <linearGradient id="up-clock-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Neon Cyan Accents -->
    <linearGradient id="up-cyan-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Golden Star Accent -->
    <linearGradient id="up-star-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Volumetric Ambient Glow -->
  <circle cx="42" cy="44" r="30" fill="#0070a8" opacity="0.3" filter="blur(11px)"/>

  <!-- Soft Ground Reflection Shadow -->
  <ellipse cx="42" cy="74" rx="28" ry="6" fill="#001a2c" opacity="0.35"/>

  <!-- Master Calendar & Clock 3D Assembly -->
  <g filter="url(#up-master-shadow)">

    <!-- 1. 3D Calendar Desk Backplate -->
    <rect x="13" y="16" width="58" height="54" rx="14" fill="url(#up-pad-grad)"/>
    <rect x="13.8" y="16.8" width="56.4" height="52.4" rx="13.2" stroke="url(#up-pad-rim)" stroke-width="1.6"/>

    <!-- Glass Specular Highlight on Calendar Pad Top Edge -->
    <path d="M14 26 C14 20 19 16.8 26 16.8 H58 C65 16.8 70 20 70 26 C58 24 26 24 14 26 Z" fill="#ffffff" opacity="0.22"/>

    <!-- 2. Calendar Top Binder Header -->
    <path d="M14 28 C14 21 19.5 17 27 17 H57 C64.5 17 70 21 70 28 V30 H14 Z" fill="url(#up-bar-grad)"/>
    <line x1="14" y1="30" x2="70" y2="30" stroke="#38bdf8" stroke-width="0.9" opacity="0.6"/>

    <!-- 3. Twin Chrome Rings -->
    <!-- Left Ring -->
    <rect x="25" y="12" width="4.5" height="10" rx="2.25" fill="url(#up-chrome)"/>
    <rect x="26" y="13" width="2.5" height="3" rx="1.25" fill="#ffffff" opacity="0.75"/>
    <ellipse cx="27.2" cy="22" rx="2" ry="1.2" fill="#002b44" opacity="0.7"/>

    <!-- Right Ring -->
    <rect x="54" y="12" width="4.5" height="10" rx="2.25" fill="url(#up-chrome)"/>
    <rect x="55" y="13" width="2.5" height="3" rx="1.25" fill="#ffffff" opacity="0.75"/>
    <ellipse cx="56.2" cy="22" rx="2" ry="1.2" fill="#002b44" opacity="0.7"/>

    <!-- 4. Crisp White Calendar Leaf -->
    <rect x="18" y="33" width="48" height="31" rx="8" fill="url(#up-sheet-grad)"/>
    <rect x="18.8" y="33.8" width="46.4" height="29.4" rx="7.2" stroke="#cbd5e1" stroke-width="0.8"/>

    <!-- Sheet Content: Scheduled Activity Placeholders -->
    <line x1="23" y1="39" x2="35" y2="39" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="23" y1="44" x2="33" y2="44" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="23" y1="49" x2="31" y2="49" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

    <!-- Glowing Active Itinerary / Schedule Marker -->
    <rect x="23" y="54" width="16" height="5" rx="2.5" fill="url(#up-cyan-neon)"/>
    <circle cx="25.5" cy="56.5" r="1.3" fill="#ffffff"/>

    <!-- 5. Floating 3D Precision Clock Dial -->
    <g filter="drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45))">
      <!-- Metallic Outer Bezel -->
      <circle cx="53" cy="50" r="17" fill="url(#up-chrome)"/>
      <!-- Inner Beveled Dark Dial -->
      <circle cx="53" cy="50" r="15" fill="url(#up-clock-face)"/>
      <!-- Cyan Accent Rim -->
      <circle cx="53" cy="50" r="14.2" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>

      <!-- Clock Hour Tick Marks (12, 3, 6, 9) -->
      <line x1="53" y1="37.5" x2="53" y2="39.5" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="65.5" y1="50" x2="63.5" y2="50" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="53" y1="62.5" x2="53" y2="60.5" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="40.5" y1="50" x2="42.5" y2="50" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>

      <!-- Glowing Neon Clock Hands (10:10 Position) -->
      <!-- Hour Hand -->
      <line x1="53" y1="50" x2="47" y2="44" stroke="url(#up-cyan-neon)" stroke-width="2.4" stroke-linecap="round"/>
      <!-- Minute Hand -->
      <line x1="53" y1="50" x2="61" y2="43" stroke="url(#up-cyan-neon)" stroke-width="2" stroke-linecap="round"/>
      <!-- Second Indicator / Hand -->
      <line x1="53" y1="53" x2="53" y2="39" stroke="#38bdf8" stroke-width="0.9" opacity="0.8"/>
      <!-- Center Chrome Cap -->
      <circle cx="53" cy="50" r="2.2" fill="#ffffff"/>
      <circle cx="53" cy="50" r="1.1" fill="#0284c7"/>

      <!-- Glass Convex Reflection on Dial -->
      <path d="M40 46 C42 40 47 36 53 36 C59 36 64 40 66 46 C60 44 46 44 40 46 Z" fill="#ffffff" opacity="0.25"/>
    </g>

    <!-- 6. Floating Emerald Live Schedule Indicator -->
    <g filter="drop-shadow(0 0 5px #10b981)">
      <circle cx="40" cy="38" r="3.2" fill="#10b981" stroke="#ffffff" stroke-width="1"/>
    </g>

    <!-- 7. Golden Star Glint on Top-Right -->
    <path d="M63 9L64.2 12L67 13.2L64.2 14.4L63 17L61.8 14.4L59 13.2L61.8 12Z" fill="url(#up-star-gold)" filter="drop-shadow(0 1px 3px rgba(0,0,0,0.4))"/>
  </g>
</svg>
